<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Serverless Peer Pong 🏓</title>
    <!-- Load PeerJS for direct browser-to-browser connections -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1a1a24; color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; touch-action: none;
        }
        #lobby {
            text-align: center; background: #252538;
            padding: 30px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90%; width: 400px;
        }
        .btn {
            background: #ff4757; color: white; border: none;
            padding: 14px 28px; font-size: 18px; font-weight: bold;
            border-radius: 8px; cursor: pointer; margin-top: 15px;
            width: 100%; transition: 0.2s;
        }
        .btn:hover { background: #ff6b81; }
        #invite-box {
            display: none; margin-top: 20px; background: #121214;
            padding: 15px; border-radius: 8px; word-break: break-all;
            font-size: 14px; border: 2px dashed #ff4757;
        }
        #game-view { display: none; flex-direction: column; align-items: center; }
        #score { font-size: 48px; font-weight: bold; margin-bottom: 10px; letter-spacing: 6px; }
        canvas {
            background: #09090e; border: 4px solid #32324d;
            border-radius: 12px; max-width: 100%; height: auto;
        }
        #status { margin-top: 15px; color: #ffa502; font-style: italic; font-size: 16px;}
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby">
        <h2>🏓 Peer-to-Peer Pong</h2>
        <p id="instruction">Connecting to matchmaking network...</p>
        <button id="start-btn" class="btn" style="display:none;">Create Match Room</button>
        <div id="invite-box">
            <p style="margin:0 0 8px 0; color:#ffa502; font-weight:bold;">Copy & send this link to your friend:</p>
            <span id="invite-url" style="color:#70a1ff;">Generating...</span>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-view">
        <div id="score"><span id="p1-score">0</span> : <span id="p2-score">0</span></div>
        <canvas id="pongCanvas" width="800" height="500"></canvas>
        <div id="status">Connecting directly to court...</div>
    </div>

<script>
    const lobby = document.getElementById('lobby');
    const gameView = document.getElementById('game-view');
    const startBtn = document.getElementById('start-btn');
    const inviteBox = document.getElementById('invite-box');
    const inviteUrl = document.getElementById('invite-url');
    const instruction = document.getElementById('instruction');
    const status = document.getElementById('status');
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');

    let peer = null;
    let conn = null;
    let isHost = false;
    let gameActive = false;

    // Game Variables
    let p1Y = 200, p2Y = 200;
    const pWidth = 15, pHeight = 90;
    let ball = { x: 400, y: 250, dx: 5, dy: 3, radius: 10 };
    let scores = { p1: 0, p2: 0 };

    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('room');

    if (targetPeerId) {
        // CLIENT MODE: Connect to the host friend
        isHost = false;
        instruction.innerText = "Joining game room...";
        peer = new Peer();
        
        peer.on('open', () => {
            conn = peer.connect(targetPeerId);
            setupConnection();
        });
    } else {
        // HOST MODE: Create a room
        isHost = true;
        peer = new Peer();
        
        peer.on('open', (id) => {
            instruction.innerText = "Network ready!";
            startBtn.style.display = 'block';
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });
    }

    startBtn.addEventListener('click', () => {
        const link = window.location.href.split('?')[0] + '?room=' + peer.id;
        inviteUrl.innerText = link;
        inviteBox.style.display = 'block';
        startBtn.style.display = 'none';
        instruction.innerText = "Waiting for your friend to open the link...";
    });

    function setupConnection() {
        conn.on('open', () => {
            lobby.style.display = 'none';
            gameView.style.display = 'flex';
            status.innerText = isHost ? "Match Live! You are Left Paddle" : "Match Live! You are Right Paddle";
            gameActive = true;
            if (isHost) runHostPhysics();
        });

        conn.on('data', (data) => {
            if (!isHost && data.type === 'sync') {
                // Client receives positions from host
                ball = data.ball;
                p1Y = data.p1Y;
                scores = data.scores;
                document.getElementById('p1-score').innerText = scores.p1;
                document.getElementById('p2-score').innerText = scores.p2;
                render();
            }
            if (data.type === 'paddle') {
                // Host receives paddle movement from client, or vice versa
                if (isHost) p2Y = data.y;
                if (!isHost) p1Y = data.y;
            }
        });

        conn.on('close', () => {
            gameActive = false;
            status.innerText = "Friend disconnected. Refresh to start a new match.";
        });
    }

    // Input Handling (Mouse & Touch)
    function handleMove(clientY) {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        const scaleY = canvas.height / rect.height;
        let y = (clientY - rect.top) * scaleY - pHeight / 2;

        if (y < 0) y = 0;
        if (y > canvas.height - pHeight) y = canvas.height - pHeight;

        if (isHost) {
            p1Y = y;
        } else {
            p2Y = y;
        }

        if (conn && conn.open) {
            conn.send({ type: 'paddle', y: y });
        }
    }

    window.addEventListener('mousemove', (e) => handleMove(e.clientY));
    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) handleMove(e.touches[0].clientY);
    }, { passive: false });

    // Host handles all game rules and loops to avoid glitches
    function runHostPhysics() {
        if (!gameActive) return;

        ball.x += ball.dx;
        ball.y += ball.dy;

        // Top/Bottom wall bounces
        if (ball.y <= 10 || ball.y >= 490) ball.dy *= -1;

        // Left Paddle hit
        if (ball.x <= 35 && ball.x >= 20 && ball.y >= p1Y && ball.y <= p1Y + pHeight) {
            ball.dx = Math.abs(ball.dx) + 0.4;
            ball.dy = (ball.y - (p1Y + pHeight/2)) * 0.15;
        }

        // Right Paddle hit
        if (ball.x >= 765 && ball.x <= 780 && ball.y >= p2Y && ball.y <= p2Y + pHeight) {
            ball.dx = -Math.abs(ball.dx) - 0.4;
            ball.dy = (ball.y - (p2Y + pHeight/2)) * 0.15;
        }

        // Scoring
        if (ball.x < 0) {
            scores.p2++;
            resetBall(-5);
        } else if (ball.x > 800) {
            scores.p1++;
            resetBall(5);
        }

        document.getElementById('p1-score').innerText = scores.p1;
        document.getElementById('p2-score').innerText = scores.p2;

        // Send positions to client
        conn.send({ type: 'sync', ball: ball, p1Y: p1Y, scores: scores });
        
        render();
        requestAnimationFrame(runHostPhysics);
    }

    function resetBall(dir) {
        ball.x = 400; ball.y = 250;
        ball.dx = dir; ball.dy = Math.random() > 0.5 ? 3 : -3;
    }

    function render() {
        ctx.fillStyle = '#09090e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Center line
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(400,0); ctx.lineTo(400,500); ctx.stroke();

        // Paddles
        ctx.fillStyle = '#ff4757'; ctx.fillRect(20, p1Y, pWidth, pHeight); // Left
        ctx.fillStyle = '#2ed573'; ctx.fillRect(765, p2Y, pWidth, pHeight); // Right

        // Ball
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();
    }
</script>
</body>
</html>
